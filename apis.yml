image: https://newminecraftservers.net/og/index.png?v=1.82871
description: NewMinecraftServers is a directory of new Minecraft servers for Java
  and Bedrock Edition, where every listing is checked automatically and shows the
  server IP, online state, players online, accepted versions and gamemodes. Alongside
  the public site it publishes a free, no-key read-only Public API (OpenAPI 3.0) for
  searching listed servers, looking one up by address, reading player-count history
  and reading cached Minecraft service status as JSON, plus a set of free browser
  tools and an open-source Paper companion plugin for server owners.
